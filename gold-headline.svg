  <path d="M80 34h350m140 0h350M80 396h350m140 0h350" stroke="#a57a42" stroke-width="1.5" opacity=".7"/>
  <path d="M500 22l4 12 12 4-12 4-4 12-4-12-12-4 12-4zM500 384l4 12 12 4-12 4-4 12-4-12-12-4 12-4z" fill="#e4bd7a"/>
