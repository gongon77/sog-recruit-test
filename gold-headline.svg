      <stop offset="0" stop-color="#fff3d4"/>
      <stop offset=".25" stop-color="#cfaa6a"/>
      <stop offset=".48" stop-color="#fff0c2"/>
      <stop offset=".72" stop-color="#b87b37"/>
      <stop offset="1" stop-color="#ebc68c"/>
